name: Build APK
on:
  push:
    branches: [ main, master ]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Generate Android platform files
        run: |
          mkdir -p /tmp/bak && cp -r lib /tmp/bak/lib && cp pubspec.yaml /tmp/bak/pubspec.yaml
          flutter create --platforms=android --project-name msf_nimaz_ki_record --org com.msf .
          rm -rf lib test && cp -r /tmp/bak/lib lib && cp /tmp/bak/pubspec.yaml pubspec.yaml
          sed -i '0,/<application/s|<application|<uses-permission android:name="com.android.alarm.permission.SET_ALARM"/>\n    <application|' android/app/src/main/AndroidManifest.xml
          sed -i 's/android:label="[^"]*"/android:label="MSF Nimaz ki Record"/' android/app/src/main/AndroidManifest.xml
          for d in mdpi hdpi xhdpi xxhdpi xxxhdpi; do cp icons/$d.png android/app/src/main/res/mipmap-$d/ic_launcher.png; done
      - run: flutter pub get
      - run: flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: MSF-Nimaz-ki-Record-APK
          path: build/app/outputs/flutter-apk/app-release.apk
