name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      # اینڈرائیڈ فولڈر خود بناتا ہے (lib اور pubspec محفوظ رکھتا ہے)
      - name: Create android project
        run: |
          mkdir -p /tmp/keep && cp -r lib pubspec.yaml /tmp/keep/
          flutter create . --org com.msf --project-name namaz_app --platforms=android
          rm -rf lib pubspec.yaml test
          cp -r /tmp/keep/lib ./lib && cp /tmp/keep/pubspec.yaml ./pubspec.yaml

      - name: Add live wallpaper + permissions
        run: python3 android_native/setup_android.py

      - run: flutter pub get
      - run: dart run flutter_launcher_icons

      - name: Build release APK
        run: flutter build apk --release

      - uses: actions/upload-artifact@v4
        with:
          name: msf-prayer-app-apk
          path: build/app/outputs/flutter-apk/app-release.apk
