name: Build MSF Nimaz ki Record APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Create Flutter project
        run: |
          flutter create \
            --platforms=android \
            --project-name msf_nimaz_ki_record \
            --org com.msf \
            .

      - name: Add local storage
        run: flutter pub add shared_preferences

      - name: Create Prayer Record App
        run: |
          cat > lib/main.dart <<'EOF'
          import 'package:flutter/material.dart';
          import 'package:shared_preferences/shared_preferences.dart';

          void main() {
            runApp(const MSFApp());
          }

          class MSFApp extends StatelessWidget {
            const MSFApp({super.key});

            @override
            Widget build(BuildContext context) {
              return MaterialApp(
                title: 'MSF نماز کی ریکارڈ',
                debugShowCheckedModeBanner: false,
                theme: ThemeData(
                  colorScheme: ColorScheme.fromSeed(
                    seedColor: Colors.green,
                  ),
                  useMaterial3: true,
                ),
                home: const PrayerHome(),
              );
            }
          }

          class PrayerHome extends StatefulWidget {
            const PrayerHome({super.key});

            @override
            State<PrayerHome> createState() => _PrayerHomeState();
          }

          class _PrayerHomeState extends State<PrayerHome> {
            final List<String> prayers = [
              'فجر',
              'ظہر',
              'عصر',
              'مغرب',
              'عشاء',
            ];

            Map<String, bool> records = {};
            bool loading = true;
            late String dayKey;

            @override
            void initState() {
              super.initState();
              final now = DateTime.now();
              dayKey =
                  '${now.year}-${now.month}-${now.day}';
              loadRecords();
            }

            Future<void> loadRecords() async {
              final prefs = await SharedPreferences.getInstance();

              for (int i = 0; i < prayers.length; i++) {
                records[prayers[i]] =
                    prefs.getBool('${dayKey}_prayer_$i') ?? false;
              }

              if (!mounted) return;

              setState(() {
                loading = false;
              });
            }

