name: Build APK
on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Backup my files
        run: |
          mkdir -p /tmp/src
          cp pubspec.yaml /tmp/src/
          cp -r lib /tmp/src/lib
          cp -r assets /tmp/src/assets
      - name: Create android project
        run: flutter create . --platforms=android --org com.msf --project-name msf_smart_storage
      - name: Restore my files
        run: |
          cp /tmp/src/pubspec.yaml pubspec.yaml
          rm -rf lib assets test
          cp -r /tmp/src/lib lib
          cp -r /tmp/src/assets assets
      - run: flutter pub get
      - run: dart run flutter_launcher_icons
      - run: sed -i 's/android:label="[^"]*"/android:label="MSF Smart Storage"/' android/app/src/main/AndroidManifest.xml
      - run: flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: MSF-Smart-Storage-APK
          path: build/app/outputs/flutter-apk/app-release.apk
