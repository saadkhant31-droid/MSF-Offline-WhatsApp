name: Build MSF Nimaz APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Find Flutter project
        shell: bash
        run: |
          set -e

          FOUND=""

          if [ -f pubspec.yaml ]; then
            FOUND="."
          else
            FOUND=$(find . -type f -name pubspec.yaml \
              -not -path './.git/*' \
              -not -path './build/*' \
              -print -quit | xargs -r dirname)

          fi

          if [ -z "$FOUND" ]; then
            echo "Searching ZIP files..."
            mkdir -p /tmp/msf_extract

            while IFS= read -r archive; do
              unzip -oq "$archive" -d /tmp/msf_extract || true
            done < <(find . -maxdepth 3 -type f -name '*.zip')

            FOUND=$(find /tmp/msf_extract \
              -type f -name pubspec.yaml \
              -print -quit | xargs -r dirname)
          fi

          if [ -z "$FOUND" ]; then
            echo "ERROR: Flutter project not found."
            exit 1
          fi

          mkdir -p "$GITHUB_WORKSPACE/msf_build"

          if [ "$FOUND" = "." ]; then
            cp -a . "$GITHUB_WORKSPACE/msf_build/"
            rm -rf "$GITHUB_WORKSPACE/msf_build/.git"
            PROJECT="$GITHUB_WORKSPACE/msf_build"
          elif [[ "$FOUND" = /tmp/* ]]; then
            cp -a "$FOUND/." "$GITHUB_WORKSPACE/msf_build/"
            PROJECT="$GITHUB_WORKSPACE/msf_build"
          else
            cp -a "$FOUND/." "$GITHUB_WORKSPACE/msf_build/"
            PROJECT="$GITHUB_WORKSPACE/msf_build"
          fi

          echo "PROJECT_DIR=$PROJECT" >> "$GITHUB_ENV"

          test -f "$PROJECT/pubspec.yaml"
          test -f "$PROJECT/lib/main.dart"

          echo "Flutter project found successfully."

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Show Flutter information
        run: |
          flutter --version
          flutter doctor -v

      - name: Prepare Android project
        shell: bash
        run: |
          set -e
          cd "$PROJECT_DIR"

          if [ ! -d android ]; then
            flutter create \
              --platforms=android \
              --project-name msf_nimaz_ki_record \
              --org com.msf \
              .
          fi

      - name: Get dependencies
        run: |
          cd "$PROJECT_DIR"
          flutter pub get

      - name: Build APK
        shell: bash
        run: |
          set -o pipefail
          cd "$PROJECT_DIR"
          flutter build apk --release --verbose \
            2>&1 | tee "$GITHUB_WORKSPACE/build-log.txt"

      - name: Verify APK
        run: |
          test -s "$PROJECT_DIR/build/app/outputs/flutter-apk/app-release.apk"

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: MSF-Nimaz-ki-Record-APK
          path: ${{ env.PROJECT_DIR }}/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload build log if failed
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: MSF-Build-Error-Log
          path: build-log.txt
          if-no-files-found: warn
          retention-days: 7
