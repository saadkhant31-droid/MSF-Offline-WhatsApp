name: Build MSF Nimaz ki Record APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Verify Flutter source files
        shell: bash
        run: |
          set -e
          test -f pubspec.yaml || { echo "ERROR: pubspec.yaml missing from repository root"; exit 1; }
          test -f lib/main.dart || { echo "ERROR: lib/main.dart missing"; exit 1; }
          test -d assets || { echo "ERROR: assets folder missing"; exit 1; }
          echo "Flutter source files found."

      - name: Generate Android platform folder
        shell: bash
        run: |
          set -e
          flutter create \
            --platforms=android \
            --project-name msf_nimaz_ki_record \
            --org com.msf \
            /tmp/msf_android_scaffold
          cp -a /tmp/msf_android_scaffold/android ./android

      - name: Configure Android app and icons
        shell: bash
        run: |
          set -e
          python3 - <<'PY'
          from pathlib import Path

          manifest = Path("android/app/src/main/AndroidManifest.xml")
          content = manifest.read_text()

          permissions = [
              '    <uses-permission android:name="android.permission.INTERNET"/>',
              '    <uses-permission android:name="com.android.alarm.permission.SET_ALARM"/>',
          ]
          for permission in permissions:
              if permission not in content:
                  content = content.replace(
                      '<application',
                      permission + '\n    <application',
                      1
                  )

          import re
          content = re.sub(
              r'android:label="[^"]*"',
              'android:label="MSF Nimaz ki Record"',
              content,
              count=1
          )
          manifest.write_text(content)
          PY

          for density in mdpi hdpi xhdpi xxhdpi xxxhdpi; do
            source="icons/${density}.png"
            target="android/app/src/main/res/mipmap-${density}/ic_launcher.png"
            if [ -f "$source" ] && [ -d "$(dirname "$target")" ]; then
              cp "$source" "$target"
            fi
          done

      - name: Resolve Flutter dependencies
        run: flutter pub get

      - name: Build release APK
        run: flutter build apk --release

      - name: Verify APK was created
        shell: bash
        run: |
          set -e
          APK="build/app/outputs/flutter-apk/app-release.apk"
          test -s "$APK"
          echo "APK successfully created:"
          ls -lh "$APK"

      - name: Upload APK download
        uses: actions/upload-artifact@v4
        with:
          name: MSF-Nimaz-ki-Record-APK
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 14
