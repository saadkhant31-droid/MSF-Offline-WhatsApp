name: Build APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check Flutter project files
        run: |
          if [ ! -f pubspec.yaml ]; then
            echo "ERROR: pubspec.yaml not found in repository root."
            exit 1
          fi

          if [ ! -f lib/main.dart ]; then
            echo "ERROR: lib/main.dart not found."
            echo "Upload your Flutter app source code first."
            exit 1
          fi

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate Android platform files
        run: |
          flutter create \
            --platforms=android \
            --project-name msf_nimaz_ki_record \
            --org com.msf \
            .

      - name: Configure Android app
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path("android/app/src/main/AndroidManifest.xml")
          s = p.read_text()

          permission = (
              '<uses-permission '
              'android:name="com.android.alarm.permission.SET_ALARM"/>'
          )

          if permission not in s:
              s = s.replace(
                  '<application',
                  permission + '\n    <application',
                  1
              )

          s = s.replace(
              'android:label="Runner"',
              'android:label="MSF Nimaz ki Record"'
          )

          p.write_text(s)
          PY

      - name: Copy app icons if available
        run: |
          for d in mdpi hdpi xhdpi xxhdpi xxxhdpi; do
            if [ -f "icons/$d.png" ]; then
              cp "icons/$d.png" \
                "android/app/src/main/res/mipmap-$d/ic_launcher.png"
            fi
          done

      - name: Get dependencies
        run: flutter pub get

      - name: Build release APK
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MSF-Nimaz-ki-Record-APK
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
