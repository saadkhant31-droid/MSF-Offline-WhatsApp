name: Build MSF Nimaz APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Find Flutter project
        shell: bash
        run: |
          set -e

          if [ -f pubspec.yaml ]; then
            echo "PROJECT_DIR=." >> "$GITHUB_ENV"
          else
            FOUND=""

            while IFS= read -r file; do
              FOUND="$(dirname "$file")"
              break
            done < <(find . -name pubspec.yaml \
              -not -path './.git/*' \
              -not -path './build/*')

            if [ -z "$FOUND" ]; then
              mkdir -p /tmp/msf_extract

              while IFS= read -r archive; do
                unzip -oq "$archive" -d /tmp/msf_extract || true
              done < <(find . -maxdepth 3 -type f -name '*.zip')

              FOUND="$(find /tmp/msf_extract \
                -name pubspec.yaml -print -quit)"

              if [ -n "$FOUND" ]; then
                FOUND="$(dirname "$FOUND")"
              fi
            fi

            if [ -z "$FOUND" ]; then
              echo "ERROR: Flutter project not found."
              echo "Upload the extracted project files or ZIP."
              exit 1
            fi

            echo "PROJECT_DIR=$FOUND" >> "$GITHUB_ENV"
          fi

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Verify Flutter files
        run: |
          set -e
          test -f "$PROJECT_DIR/pubspec.yaml"
          test -f "$PROJECT_DIR/lib/main.dart"
          echo "Flutter project found: $PROJECT_DIR"

      - name: Generate Android files if missing
        run: |
          if [ ! -d "$PROJECT_DIR/android" ]; then
            cd "$PROJECT_DIR"
            flutter create \
              --platforms=android \
              --project-name msf_nimaz_ki_record \
              --org com.msf \
              .
          fi

      - name: Build APK
        run: |
          cd "$PROJECT_DIR"
          flutter pub get
          flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MSF-Nimaz-ki-Record-APK
          path: ${{ env.PROJECT_DIR }}/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 14
