name: Build APK
on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unzip and locate project
        run: |
          for z in *.zip; do [ -f "$z" ] && unzip -o -q "$z"; done
          P=$(find . -maxdepth 3 -name pubspec.yaml -not -path './.git/*' | head -n1)
          if [ -z "$P" ]; then
            echo "pubspec.yaml nahi mili"; ls -R | head -50; exit 1
          fi
          DIR=$(dirname "$P")
          echo "Project dir: $DIR"
          if [ "$DIR" != "." ]; then cp -a "$DIR"/. .; fi
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: flutter create . --platforms=android --org com.msf --project-name msf_smart_storage
      - run: flutter pub get
      - run: dart run flutter_launcher_icons
      - run: sed -i 's/android:label="[^"]*"/android:label="MSF Smart Storage"/' android/app/src/main/AndroidManifest.xml
      - run: flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: MSF-Smart-Storage-APK
          path: build/app/outputs/flutter-apk/app-release.apk
