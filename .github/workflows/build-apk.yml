name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: android-actions/setup-android@v4

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9

      - name: Build debug APK
        run: |
          echo "=== FILES ==="
          ls -la
          DIR=$(dirname "$(find . -name settings.gradle -not -path './.git/*' | head -1)")
          echo "=== Building in: $DIR ==="
          cd "$DIR"
          gradle assembleDebug --console=plain 2>&1 | tail -n 25
          exit ${PIPESTATUS[0]}

      - uses: actions/upload-artifact@v4
        with:
          name: MSF-Offline-WhatsApp-APK
          path: "**/build/outputs/apk/debug/*.apk"
